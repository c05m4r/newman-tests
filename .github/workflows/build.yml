name: Build and Push Docker Image

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: hubdocker
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve latest versions from registry
        id: versions
        run: |
          NEWMAN=$(bun pm view newman version)
          HTMLEXTRA=$(bun pm view newman-reporter-htmlextra version)
          echo "newman=$NEWMAN" >> "$GITHUB_OUTPUT"
          echo "htmlextra=$HTMLEXTRA" >> "$GITHUB_OUTPUT"

      - name: Check if combo tag already exists
        id: existing
        run: |
          TAG="newman-${{ steps.versions.outputs.newman }}-htmlextra-${{ steps.versions.outputs.htmlextra }}"
          if docker manifest inspect "c05m4r/newman:${TAG}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.existing.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (no push)
        if: steps.existing.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: c05m4r/newman:smoke

      - name: Smoke test against JSONPlaceholder
        if: steps.existing.outputs.skip == 'false'
        run: |
          docker run --rm \
            -v "$PWD/smoke:/smoke" \
            c05m4r/newman:smoke run /smoke/JSONPlaceholder.postman_collection.json \
            -r htmlextra \
            --reporter-htmlextra-export /smoke/report.html
          test -s smoke/report.html
          grep -qi "<html" smoke/report.html
          echo "Smoke test OK — report generated"

      - name: Push to Docker Hub
        if: steps.existing.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            c05m4r/newman:latest
            c05m4r/newman:newman-${{ steps.versions.outputs.newman }}-htmlextra-${{ steps.versions.outputs.htmlextra }}