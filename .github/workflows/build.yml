name: Build and Push Docker Image

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest versions from npm
        id: versions
        run: |
          NEWMAN=$(npm view newman version)
          HTMLEXTRA=$(npm view newman-reporter-htmlextra version)
          echo "newman=$NEWMAN" >> "$GITHUB_OUTPUT"
          echo "htmlextra=$HTMLEXTRA" >> "$GITHUB_OUTPUT"

      - name: Check if combo tag already exists
        id: existing
        run: |
          TAG="newman-${{ steps.versions.outputs.newman }}-htmlextra-${{ steps.versions.outputs.htmlextra }}"
          if docker manifest inspect "c05m4r/newman:${TAG}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.existing.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.existing.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            c05m4r/newman:latest
            c05m4r/newman:newman-${{ steps.versions.outputs.newman }}-htmlextra-${{ steps.versions.outputs.htmlextra }}